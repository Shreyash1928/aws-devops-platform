- name: Install nginx using SSM
  ansible.builtin.shell: |
    yum install -y nginx
  args:
    executable: /bin/bash

- name: Enable and start nginx
  ansible.builtin.shell: |
    systemctl enable nginx
    systemctl start nginx
  args:
    executable: /bin/bash

- name: Create nginx index page
  ansible.builtin.shell: |
    cat <<'EOF' > /usr/share/nginx/html/index.html
    <html>
      <head><title>Deployed via Ansible SSM</title></head>
      <body>
        <h1>🚀 NGINX DEPLOYED SUCCESSFULLY</h1>
        <p>Deployed using Ansible + AWS SSM</p>
      </body>
    </html>
    EOF
  args:
    executable: /bin/bash
