---
- name: Install nginx using SSM (raw)
  ansible.builtin.raw: |
    sudo yum install -y nginx

- name: Enable nginx
  ansible.builtin.raw: |
    sudo systemctl enable nginx

- name: Start nginx
  ansible.builtin.raw: |
    sudo systemctl start nginx

- name: Create nginx index page
  ansible.builtin.raw: |
    sudo tee /usr/share/nginx/html/index.html > /dev/null <<'EOF'
    <html>
      <head><title>Deployed via Ansible SSM</title></head>
      <body>
        <h1>🚀 NGINX DEPLOYED SUCCESSFULLY</h1>
        <p>Deployed using Ansible + AWS SSM</p>
      </body>
    </html>
    EOF
