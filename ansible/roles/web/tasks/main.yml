- name: Install nginx
  ansible.builtin.yum:
    name: nginx
    state: present

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Create index page
  ansible.builtin.copy:
    dest: /usr/share/nginx/html/index.html
    content: |
      <html>
        <head><title>Ansible SSM</title></head>
        <body>
          <h1>🚀 NGINX DEPLOYED SUCCESSFULLY</h1>
          <p>Via Ansible + AWS SSM</p>
        </body>
      </html>
