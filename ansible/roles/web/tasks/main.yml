- name: Install nginx via AWS SSM
  amazon.aws.ssm_send_command:
    document_name: AWS-RunShellScript
    targets:
      - key: InstanceIds
        values:
          - "{{ inventory_hostname }}"
    parameters:
      commands:
        - yum install -y nginx
        - systemctl enable nginx
        - systemctl start nginx

- name: Create nginx index page via AWS SSM
  amazon.aws.ssm_send_command:
    document_name: AWS-RunShellScript
    targets:
      - key: InstanceIds
        values:
          - "{{ inventory_hostname }}"
    parameters:
      commands:
        - |
          cat <<'EOF' > /usr/share/nginx/html/index.html
          <html>
            <head>
              <title>Deployed via Ansible SSM</title>
            </head>
            <body>
              <h1>🚀 NGINX DEPLOYED SUCCESSFULLY</h1>
              <p>Deployed using Ansible + AWS SSM</p>
            </body>
          </html>
          EOF
